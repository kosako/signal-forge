[project]
name = "signal-forge"
version = "0.1.0"
description = "個人用インテリジェンスサービス(A-lite MVP)。X・RSS・手動URLを毎朝の日本語ダイジェストに圧縮する"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "trafilatura>=2.1.0",
    "typer>=0.15",
]

[project.scripts]
intel = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts"]  # Day 0 の使い捨てスクリプト(vibe 品質。plan.md #1)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/cli.py" = ["B008"]  # typer.Option を引数既定値に書くのは Typer の標準イディオム

[tool.pytest.ini_options]
testpaths = ["tests"]
